# ════════════════════════════════════════════════════════════════════════
# Toolbox45 — nginx de TESTE para a Fase 3, fatia 1 (frontend React, só
# login por enquanto) — MESMO padrão de frontend/nginx.fase2-teste.conf
# (Fase 2): container isolado, porta nova, não referenciado por nenhum
# Dockerfile (só usado via bind-mount manual sobre /etc/nginx/nginx.conf),
# não mexe em nada que os usuários já usam.
#
# Só HTTP (sem bloco 443/ssl) — mesma decisão da Fase 2, evita a
# dependência do volume /etc/nginx/tls neste container de validação.
#
# Upstream aponta pro backend Python (toolbox45-backend-py:8000, já
# validado nas fatias 1-10 da Fase 1) em vez do Node
# (toolbox45-backend:3000) — resto idêntico ao nginx.conf de produção
# desta imagem.
# ════════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  upstream toolbox45_backend_py {
    server toolbox45-backend-py:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location /api/ {
      proxy_pass http://toolbox45_backend_py/api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
