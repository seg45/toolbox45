# ════════════════════════════════════════════════════════════════════════
# Toolbox45 — nginx do frontend (React/Vite build)
#
# Serve os arquivos estaticos do build e faz proxy reverso de /api/* para o
# backend Python (servico "toolbox45-backend" no docker-compose.yml, porta
# 8000). A porta 443 (HTTPS) serve o app; a porta 80 so redireciona para
# HTTPS (exceto GET /api/health, que continua respondendo em HTTP para
# healthchecks/monitoramento). O certificado vem do volume compartilhado
# toolbox45-tls (montado somente-leitura em /etc/nginx/tls) e o
# docker-entrypoint.sh recarrega o nginx quando ele muda (SSL Certificate em
# Settings → System).
#
# Endurecimento (auditoria de seguranca, out/2026):
#   * redirect HTTP→HTTPS + HSTS (o cookie de sessao tem a flag Secure — ver
#     server-py/app/session.py — e so trafega em HTTPS);
#   * cabecalhos de seguranca + Content-Security-Policy (script-src 'self':
#     nenhum <script> inline roda, mesmo que alguem consiga injetar HTML);
#   * limit_req (login/registro/API) e limites de corpo por rota;
#   * server_tokens off, timeouts curtos de cabecalho/corpo.
#
# ATENCAO ao editar: `add_header` so e herdado quando o nivel interno NAO
# declara nenhum add_header proprio. Por isso TODOS os cabecalhos de
# seguranca ficam no nivel `http` e nenhum server/location declara add_header
# (o cache de css/js usa `expires -1`, que gera Cache-Control: no-cache, em vez
# de add_header). Se for ADICIONAR um add_header num location, repita neste
# lugar todos os de seguranca.
#
# Se algum dia houver um proxy/balanceador na frente que termine o TLS e fale
# HTTP com este nginx, remova o redirect da porta 80 (senao ha loop de
# redirecionamento) e confirme que ele repassa X-Forwarded-Proto: https.
# ════════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  keepalive_timeout 30s;
  client_header_timeout 10s;
  client_body_timeout 20s;
  send_timeout 20s;
  client_max_body_size 20m;   # logo (2 MB base64), importacao de pastas/CSV, certificado

  # ── Limites de taxa (por IP de origem) ─────────────────────────────────
  # login: 6/min por IP (+ rajada de 8) — freia forca bruta; registro: 3/min;
  # demais rotas da API: 30 req/s por IP (+ rajada de 60) — o app dispara
  # varias chamadas ao abrir, mas nada perto disso em uso normal.
  #
  # A chave e $tb_key, nao $binary_remote_addr direto: se o Docker entregar as
  # conexoes com o IP do GATEWAY da rede (docker-proxy), todo mundo teria o mesmo
  # IP e o limite viraria global (6 logins/min no servidor inteiro). Nesse caso
  # a chave fica vazia e o nginx NAO limita (chave vazia = sem contagem); o
  # backend continua limitando as falhas de senha por usuario. O IP do gateway
  # e descoberto no boot do container (docker-entrypoint.sh grava
  # /run/toolbox45/tb-gateway.conf -- /run e tmpfs porque o rootfs e somente-leitura;
  # sem gateway descoberto o arquivo diz "nenhum" e o limite por IP e o normal).
  include /run/toolbox45/tb-gateway.conf;   # define $tb_gw (1 = origem e o gateway)
  map $tb_gw $tb_key {
    1       "";
    default $binary_remote_addr;
  }
  limit_req_zone  $tb_key zone=tb_login:10m    rate=6r/m;
  limit_req_zone  $tb_key zone=tb_register:10m rate=3r/m;
  limit_req_zone  $tb_key zone=tb_api:10m      rate=30r/s;
  limit_conn_zone $tb_key zone=tb_conn:10m;
  limit_req_status  429;
  limit_conn_status 429;
  limit_conn tb_conn 100;

  # ── Cabecalhos de seguranca (heranca: ver nota no topo) ────────────────
  # CSP: scripts so de 'self' (o app nao usa <script> inline: os "boot
  # scripts" de tema/login moram em /boot-*.js); style-src precisa de
  # 'unsafe-inline' (React aplica style="..." e o HTML rico das notas usa
  # style) e das fontes do Google Fonts (login.html); imagens: proprias,
  # data: (logo e imagens coladas em notas) e https:; conexoes (fetch) so
  # para a propria origem; sem frames, sem <object>, sem <base>.
  # HSTS: 30 dias por enquanto (sem includeSubDomains/preload); depois de
  # alguns dias sem problema pode subir para 31536000. Navegadores ignoram
  # HSTS recebido por HTTP, entao o mesmo cabecalho em ambas as portas e ok.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=2592000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  upstream toolbox45_backend {
    server toolbox45-backend:8000;
    keepalive 32;
  }

  # ── Proxy para o backend (herdado por todos os locations abaixo) ───────
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;   # pg_dump/pg_restore de backup podem demorar

  # ── Porta 80: so redireciona para HTTPS ────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Healthcheck/monitoramento continuam funcionando em HTTP puro.
    location = /api/health {
      proxy_pass http://toolbox45_backend;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── Porta 443: o app ───────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # 429/413 em JSON (o app le {error, message} de qualquer resposta de erro
    # da API; a pagina HTML padrao do nginx apareceria como erro ilegivel).
    error_page 429 @too_many_requests;
    error_page 413 @payload_too_large;
    location @too_many_requests {
      default_type application/json;
      return 429 '{"error":"too_many_requests","message":"Too many requests. Wait a moment and try again."}';
    }
    location @payload_too_large {
      default_type application/json;
      return 413 '{"error":"payload_too_large","message":"The request is too large."}';
    }

    # css/js: sempre revalida (Cache-Control: no-cache). `expires -1` em vez
    # de add_header — ver nota no topo sobre heranca de add_header.
    location ~* \.(?:css|js)$ {
      expires -1;
      try_files $uri =404;
    }

    # Login: taxa baixa (forca bruta) e corpo minusculo.
    location = /api/auth/login {
      limit_req zone=tb_login burst=8 nodelay;
      client_max_body_size 16k;
      proxy_pass http://toolbox45_backend;
    }

    # Auto-cadastro: aberto ao publico, entao taxa ainda mais baixa.
    location = /api/auth/register {
      limit_req zone=tb_register burst=5 nodelay;
      client_max_body_size 16k;
      proxy_pass http://toolbox45_backend;
    }

    # Primeiro acesso (cria o super_admin enquanto a instalacao nao tem um): so
    # funciona uma vez, mas fica publico ate la — mesma taxa baixa do cadastro.
    location = /api/auth/setup {
      limit_req zone=tb_register burst=5 nodelay;
      client_max_body_size 16k;
      proxy_pass http://toolbox45_backend;
    }

    # Preferencias (chave/valor): corpo pequeno.
    location ~ ^/api/(user-data|global-settings)$ {
      limit_req zone=tb_api burst=60 nodelay;
      client_max_body_size 2m;
      proxy_pass http://toolbox45_backend;
    }

    location /api/ {
      limit_req zone=tb_api burst=60 nodelay;
      proxy_pass http://toolbox45_backend/api/;
    }
  }
}
