# ════════════════════════════════════════════════════════════════════════
# Toolbox45 — frontend React (Fase 3) nginx config
#
# Cópia de frontend/nginx.conf (frontend JS atual), adaptada só no
# comentário de topo — o resto é idêntico de propósito (mesmo proxy /api/,
# mesmo upstream com keepalive, mesmo bloco HTTPS com hot-reload de TLS via
# docker-entrypoint.sh) porque o CONTRATO com o backend não muda nesta
# fase: só troca o processo que gera os arquivos estáticos (Vite em vez de
# arquivos JS puro copiados direto). Ver comentário completo no
# nginx.conf original.
# ════════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  upstream toolbox45_backend {
    server toolbox45-backend:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location /api/ {
      proxy_pass http://toolbox45_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location /api/ {
      proxy_pass http://toolbox45_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
