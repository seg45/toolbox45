<!DOCTYPE html>
<!--
  Fase 3, fatia 2 — app shell (header, sidebar, gate de autenticação,
  modal de Configurações). Porta de index.html (app original, JS puro).
-->
<html lang="en" data-theme="light">
<head>
<!-- ══ GATE DE LOGIN — porta 1:1 do script equivalente no index.html
     original: roda ANTES de qualquer CSS/paint, primeiro <script> do
     <head>, pra minimizar o "flash" do app aparecendo antes do redirect.
     'cpa-authenticated' é gravado em login.html após um login local ou
     Google bem-sucedido, e apagado por AuthProvider::logout() (ver
     src/lib/auth.tsx) — enquanto não existir, sempre volta pra
     login.html primeiro. -->
<script>
  (function () {
    try {
      if (localStorage.getItem('cpa-authenticated') !== '1') {
        location.replace('login.html');
      }
    } catch (e) { /* localStorage indisponível — deixa passar, sem gate */ }
  })();
</script>
<!-- BOOT DE TEMA/COR — o index.html original não tinha este script (só
     login.html): js/theme.js rodava como <script src> no fim do <body>,
     então o app principal também piscava o tema claro/teal padrão por um
     instante antes de aplicar o real. Replicado aqui como uma melhoria
     deliberada (mesmo padrão/preset já usado em login.html) — resultado
     visual final idêntico ao original, só sem o flash. Ver comentário
     completo em login.html. -->
<script>
  (function () {
    var ACCENT_PRESETS = {
      teal:   { teal: '#1695A3', tealBg: 'rgba(22,149,163,.08)', text: '#fff' },
      pink:   { teal: '#DA1572', tealBg: 'rgba(218,21,114,.08)', text: '#fff' },
      blue:   { teal: '#60A5FA', tealBg: 'rgba(96,165,250,.08)', text: '#fff' },
      green:  { teal: '#4ADE80', tealBg: 'rgba(74,222,128,.08)', text: '#fff' },
      purple: { teal: '#C084FC', tealBg: 'rgba(192,132,252,.08)', text: '#fff' },
      orange: { teal: '#FB923C', tealBg: 'rgba(251,146,60,.08)', text: '#fff' },
      red:    { teal: '#F87171', tealBg: 'rgba(248,113,113,.08)', text: '#fff' },
      white:  { teal: '#FFFFFF', tealBg: 'rgba(255,255,255,.12)', text: '#0D1117' },
    };
    var theme = 'light', accent = 'teal';
    try {
      // Preferência PESSOAL ('cpa-theme'/'cpa-accent') tem prioridade
      // aqui — diferente de login.html, que só olha o default do admin
      // (ver comentário lá). Só cai pro default do admin
      // ('cpa-org-theme'/'cpa-org-accent') quando o navegador ainda não
      // tem nenhuma preferência pessoal salva — mesma regra de
      // usePersonalTheme() em src/lib/theme.ts.
      var pt = localStorage.getItem('cpa-theme');
      if (pt === 'dark' || pt === 'light') {
        theme = pt;
        accent = localStorage.getItem('cpa-accent') || localStorage.getItem('cpa-org-accent') || 'teal';
      } else {
        var ot = localStorage.getItem('cpa-org-theme');
        if (ot === 'dark' || ot === 'light') theme = ot;
        accent = localStorage.getItem('cpa-org-accent') || 'teal';
      }
    } catch (e) { /* localStorage indisponível — fica no fallback claro/teal */ }
    if (theme === 'light' && accent === 'white') accent = 'teal';
    document.documentElement.setAttribute('data-theme', theme);
    var preset = ACCENT_PRESETS[accent] || ACCENT_PRESETS.teal;
    var s = document.documentElement.style;
    s.setProperty('--teal', preset.teal);
    s.setProperty('--teal-bg', preset.tealBg);
    s.setProperty('--teal-text', preset.text);
  })();
</script>
<!-- Logo — mesmo boot síncrono de cache local usado no header original
     (ver index.html original, dentro de .hdr-logo) — aplica o logo
     customizado (se já cacheado) antes do primeiro paint, evitando o
     "flash" do logo default. Em React, o equivalente idiomático é o
     useLogo() hook (lazy useState reading localStorage) usado por
     Header.tsx — não precisa deste script inline aqui: o próprio
     primeiro render do componente já lê o cache de forma síncrona. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox45</title>
<link rel="icon" type="image/x-icon" href="/img/icon-toolbox45.ico">
<link rel="shortcut icon" type="image/x-icon" href="/img/icon-toolbox45.ico">

</head>
<body>

<script type="module" src="/src/pages/main-index.tsx"></script>
</body>
</html>
