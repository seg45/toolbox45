services:
  # ── BANCO DE DADOS ──
  # PostgreSQL — o backend (server-py/app/db.py) conecta nele via rede
  # (PGHOST=toolbox45-db) e a cada boot aplica schema.sql, migrações e seeds
  # de primeira instalação (idempotente). Sem "ports:" — não é alcançável de
  # fora do host, só pelo toolbox45-backend via rede interna do compose.
  toolbox45-db:
    # Imagem FIXADA por digest (auditoria de seguranca, out/2026) -- atualizar com
    # scripts/update-image-digests.sh (e fazer backup antes de trocar a imagem).
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: toolbox45-db
    restart: unless-stopped
    # Prioridade de sobrevivência no OOM: o docker01 tem ~1 GiB de RAM e um
    # `docker compose build` do frontend (npm + tsc + vite) chega a esgotar a
    # memória do host — em 05/out o kernel matou o uvicorn do backend em
    # produção no meio de um build. Com oom_score_adj negativo o kernel
    # prefere matar processos do build (que são descartáveis) a este
    # container. (-500 numa escala de -1000..1000; padrão = 0.)
    oom_score_adj: -500
    # Hardening (auditoria de seguranca, out/2026): sem escalada de privilegio,
    # sem capabilities alem das que o entrypoint do Postgres usa (chown do
    # diretorio de dados e troca para o usuario `postgres`) e rootfs
    # somente-leitura (so o volume de dados e o tmpfs abaixo sao graváveis).
    # Se algum dia o container nao subir apos mexer nisto, ver `docker compose logs`.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-toolbox45}"
      POSTGRES_USER: "${POSTGRES_USER:-toolbox45}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-toolbox45}"
    volumes:
      - toolbox45-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toolbox45} -d ${POSTGRES_DB:-toolbox45}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── BACKEND ──
  # API REST (Python/FastAPI + PostgreSQL) — não serve o frontend estático
  # (isso é o toolbox45-frontend abaixo). Também aceita chamadas externas
  # autenticadas por API key (header X-API-Key — ver Settings → System →
  # API access na UI, e api_keys em server-py/app/schema.sql). Sem "ports:" —
  # só o toolbox45-frontend fala com ele (proxy reverso /api/*, ver
  # frontend-react/nginx.conf).
  toolbox45-backend:
    build:
      context: .
      dockerfile: server-py/Dockerfile
      # Ver nota de MTU/rede no serviço toolbox45-frontend abaixo — mesmo
      # racional (apt-get durante o build precisa da rede do host nesta VM).
      network: host
    image: toolbox45-backend:latest
    container_name: toolbox45-backend
    restart: unless-stopped
    # Ver o racional em toolbox45-db acima: protege a API de produção quando
    # um build no mesmo host estoura a RAM.
    oom_score_adj: -500
    # Hardening (ver toolbox45-db): o backend ja roda como usuario nao-root
    # (uid 999); aqui some qualquer capability, a escalada de privilegio e a
    # escrita no rootfs. Grava so nos volumes (backups, tls) e em /tmp (tmpfs).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      toolbox45-db:
        condition: service_healthy
    # GET /api/health só responde depois de init_db() E ensure_tls_bootstrap()
    # (lifespan em server-py/app/main.py) — ou seja, "healthy" aqui também garante que o
    # volume de certificados (toolbox45-tls) já tem um cert.pem/key.pem
    # válidos, o que o toolbox45-frontend abaixo depende para poder subir
    # seu bloco "listen 443 ssl" sem erro.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    environment:
      PGHOST: toolbox45-db
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-toolbox45}"
      PGUSER: "${POSTGRES_USER:-toolbox45}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-toolbox45}"
      # Login com Google (opcional) — habilita o botão "Sign in with Google"
      # em login.html (ver GET /api/auth/google* em server-py/app/routers/oauth.py). Sem
      # login do Windows/NTLM (removido) nem sessão Google, só resta o login
      # local (usuário/senha) — sempre disponível, não precisa de variável
      # nenhuma.
      #
      # IMPORTANTE — este repositório é PÚBLICO: NUNCA escreva o Client ID/
      # Secret diretamente aqui neste arquivo (ficaria no histórico do git
      # pra sempre, mesmo removendo depois). As 3 variáveis abaixo são só a
      # REFERÊNCIA (${VAR}) — o valor de verdade vai num arquivo ".env" ao
      # lado deste docker-compose.yml (mesmo padrão do POSTGRES_PASSWORD
      # acima), que o .gitignore já exclui do versionamento. Ver o passo a
      # passo completo (criar o Client ID no Google Cloud Console e o
      # conteúdo do .env) em docs/server-overview.md.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      # Login com Microsoft (opcional) — mesmo esquema do Google acima, só troca
      # o provedor (ver GET /api/auth/microsoft* em server-py/app/routers/oauth.py). MICROSOFT_TENANT_ID
      # é opcional (default "common" = qualquer conta Microsoft, pessoal ou de qualquer
      # organização); um tenant ID/domínio específico restringe o login só àquela
      # organização. Passo a passo completo (App registration no Azure Portal) em
      # docs/server-overview.md.
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
      MICROSOFT_REDIRECT_URI: "${MICROSOFT_REDIRECT_URI:-}"
      MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID:-common}"
      # Chave que cifra o client secret do OAuth gravado no banco (AES-256-GCM, ver
      # server-py/app/secrets_box.py). Vive SO no .env do servidor -- nunca no banco
      # nem nos backups. Gere com scripts/init-secret-key.sh. Sem ela o secret
      # continua em texto puro (e o health check avisa).
      TOOLBOX45_SECRET_KEY: "${TOOLBOX45_SECRET_KEY:-}"
    volumes:
      # Dumps do Backup & Restore (Settings → System → Database) — pg_dump/
      # pg_restore, fora do volume de dados do Postgres, sobrevive a
      # rebuild/restart deste container.
      - toolbox45-backups:/app/backups
      # Certificado/chave TLS (Settings → System → SSL Certificate) —
      # ensure_tls_bootstrap() em server-py/app/tls.py
      # escrevem aqui; COMPARTILHADO (rw aqui, ro no toolbox45-frontend
      # abaixo) porque quem realmente termina HTTPS é o nginx do frontend,
      # não este container — ver frontend-react/nginx.conf.
      - toolbox45-tls:/app/tls

  # ── FRONTEND ──
  # nginx: serve o build estático do React (Vite) e faz proxy
  # reverso de /api/* para o toolbox45-backend — ver frontend-react/nginx.conf.
  # ÚNICO container com porta publicada; é com ele que o navegador fala.
  toolbox45-frontend:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
      # "network: host" faz o build usar a rede do próprio host em vez da
      # bridge padrão do Docker — em alguns servidores/VPNs a bridge do
      # Docker tem um MTU incompatível com a rede real, e etapas do build
      # que baixam pacotes travam com "Connection timed out" mesmo com
      # internet funcionando normalmente no host.
      network: host
    image: toolbox45-frontend:latest
    container_name: toolbox45-frontend
    restart: unless-stopped
    # Hardening (ver toolbox45-db). O nginx sobe como root so para abrir 80/443
    # (NET_BIND_SERVICE) e trocar os workers para o usuario `nginx` (SETUID/
    # SETGID/CHOWN); DAC_OVERRIDE para ler a chave TLS do volume (dono = backend).
    # Rootfs somente-leitura: /run (pid, tb-gateway.conf gerado no boot),
    # /var/cache/nginx (buffers) e /tmp sao tmpfs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /run
      - /var/cache/nginx
      - /tmp
    depends_on:
      # "service_healthy" (não só "started") — o healthcheck do backend só
      # fica healthy depois de ensure_tls_bootstrap() gerar cert.pem/key.pem
      # (ver comentário no serviço acima), garantindo que eles já existem no
      # volume compartilhado quando o nginx aqui sobe e lê o bloco "listen
      # 443 ssl" de frontend-react/nginx.conf — sem isso, o nginx falharia ao
      # iniciar (arquivo inexistente) numa primeira subida "do zero".
      toolbox45-backend:
        condition: service_healthy
    ports:
      # Host:container — único ponto de entrada da aplicação, em
      # http://<ip-do-servidor> ou https://<ip-do-servidor>.
      - "80:80"
      - "443:443"
    volumes:
      # Somente leitura — quem escreve é o toolbox45-backend (ver volume
      # acima); docker-entrypoint.sh observa esta pasta com inotifywait e dá
      # `nginx -s reload` sempre que o certificado mudar.
      - toolbox45-tls:/etc/nginx/tls:ro

volumes:
  toolbox45-db-data:
  toolbox45-backups:
  toolbox45-tls:
