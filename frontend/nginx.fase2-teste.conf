# ════════════════════════════════════════════════════════════════════════
# Toolbox45 — nginx de TESTE pra Fase 2 do plano de migração (Project
# toolbox45: validação lado a lado do frontend JS atual, inalterado, contra
# o backend Python em vez do Node) — NÃO é usado pelo build de produção
# (frontend/Dockerfile só copia frontend/nginx.conf, por nome; este arquivo
# é ignorado pelo COPY normal).
#
# Diferença do frontend/nginx.conf real: (1) upstream aponta pra
# toolbox45-backend-py:8000 em vez de toolbox45-backend:3000; (2) só HTTP
# (sem o bloco "listen 443 ssl") — decisão deliberada pra este teste não
# depender do volume toolbox45-tls, que nginx.conf real exige no boot.
#
# Uso: sobe a imagem de produção JÁ existente (toolbox45-frontend:latest,
# arquivos estáticos idênticos aos reais) mas com ESTE arquivo montado por
# cima de /etc/nginx/nginx.conf via bind mount no `docker run` — ver
# comandos de validação da Fase 2 (Project toolbox45).
# ════════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  upstream toolbox45_backend_py {
    server toolbox45-backend-py:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location /api/ {
      proxy_pass http://toolbox45_backend_py/api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
