# ════════════════════════════════════════════════════════════════════════
# Toolbox45 — frontend (nginx) config
#
# Serves the static app (index.html, css/, js/, img/) and reverse-proxies
# /api/* to the backend container (toolbox45-backend:3000) — the browser
# only ever talks to THIS container; toolbox45-backend and toolbox45-db
# have no published ports (see docker-compose.yml).
#
# NOTE on the upstream "keepalive"/proxy_http_version 1.1 settings below:
# reuses TCP connections from nginx -> backend instead of opening a new one
# per request — plain connection-reuse performance, nothing auth-related.
# (Login used to include Windows/NTLM here, which needed this for the
# handshake to survive the proxy hop — removed; only local + Google login
# remain, both stateless HTTP, so this is now just a performance tweak.)
#
# NOTE on HTTPS: /etc/nginx/tls/cert.pem + key.pem come from the
# toolbox45-tls named volume (see docker-compose.yml), which is written by
# toolbox45-backend (ensureTlsBootstrap()/generateSelfSignedCert() in
# server/index.js — a self-signed cert on first boot, or whatever the admin
# imports via Settings → System → SSL Certificate) and mounted here READ-ONLY.
# docker-entrypoint.sh watches that volume with inotifywait and runs
# `nginx -s reload` whenever cert.pem/key.pem change, so importing/deleting a
# certificate in the UI takes effect within ~1s, with no container restart.
# ════════════════════════════════════════════════════════════════════════

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 20m; # linhas de comando com imagem em base64 (ver server/index.js, express.json 15mb)

  upstream toolbox45_backend {
    server toolbox45-backend:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # CSS/JS não têm cache-busting no index.html (sem hash/query string nos
    # <link>/<script>) — sem isto, o navegador pode continuar servindo a
    # versão antiga do arquivo do cache dele mesmo DEPOIS de reconstruir o
    # container (foi o que aconteceu com o restyle das Notes: o código novo
    # estava no ar, mas o navegador ainda mostrava o CSS antigo). No-cache
    # aqui não desliga o cache — só força o navegador a revalidar (If-Modified-
    # Since/ETag) a cada carregamento, então uma mudança no arquivo já é
    # percebida na hora, sem precisar de Ctrl+F5 manual.
    location ~* \.(?:css|js)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location /api/ {
      proxy_pass http://toolbox45_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── HTTPS ──
  # cert.pem/key.pem sempre existem quando este container sobe — o
  # healthcheck do toolbox45-backend (ver docker-compose.yml) só fica
  # "healthy" depois de ensureTlsBootstrap() ter gerado um certificado
  # self-signed (se nenhum tiver sido importado ainda), e o frontend só inicia
  # depois do backend estar healthy. HTTP (porta 80) continua ativo em
  # paralelo — ver location blocks acima — para quem não quiser/puder usar
  # HTTPS ainda.
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location /api/ {
      proxy_pass http://toolbox45_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
