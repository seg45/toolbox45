<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox45 — Log in</title>
<!-- Favicon: mesmo ícone (.ico) usado na intranet da empresa — ver img/icoCG.ico. -->
<link rel="icon" type="image/x-icon" href="img/icoCG.ico">
<link rel="shortcut icon" type="image/x-icon" href="img/icoCG.ico">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Reaproveita as mesmas variáveis de tema/cor de destaque e as classes
     .btn/.set-input/.set-label/.set-hint já usadas nos modais do app
     (css/components.css) — css/login.css só acrescenta o layout específico
     desta página (card centralizado, divisor "or", botão de Windows
     authentication). Não carrega css/layout.css (grade do app/sidebar) —
     esta página não usa nada daquilo. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

<div class="login-card">
  <!-- Logo oficial do app (mesmo arquivo do header, ver .hdr-logo em
       index.html/css/layout.css) — cor única (--teal), não depende mais de
       [data-theme]. -->
  <div class="login-brand">
    <img class="login-logo-img" src="img/logo-toolbox45.png?v=1" alt="Toolbox45">
    <span class="login-logo-txt">Toolbox45</span>
  </div>

  <div class="set-hint login-error" id="loginPageErrorMsg" style="color:var(--red); display:none;"></div>

  <div class="set-group" style="margin-top:14px;">
    <span class="set-label">Username</span>
    <input class="set-input" type="text" id="lpUsernameInput" autocomplete="username">
  </div>
  <div class="set-group">
    <span class="set-label">Password</span>
    <input class="set-input" type="password" id="lpPasswordInput" autocomplete="current-password">
  </div>
  <button type="button" class="btn btn-primary login-submit-btn" id="lpSubmitBtn" onclick="submitLocalLogin()">Log in</button>

  <div class="login-divider"><span>or</span></div>

  <!-- "Windows authentication": reaproveita a MESMA identificação NTLM
       silenciosa que o app já usa em segundo plano (ver server/index.js) —
       clicar aqui só confirma/consulta se ela funcionou (GET /api/me) e, se
       sim, marca a sessão do navegador como autenticada. Ver js/login.js. -->
  <button type="button" class="btn login-windows-btn" id="lpWindowsBtn" onclick="submitWindowsLogin()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="1.5"/><path d="M3 9h18"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>
    <span>Continue with Windows authentication</span>
  </button>
</div>

<script src="js/theme.js"></script>
<script src="js/login.js"></script>
</body>
</html>
