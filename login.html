<!DOCTYPE html>
<!-- data-theme="light" fixo (pedido do usuário: "a tela de login não deve
     ter modo escuro") — css/theme.css define o tema ESCURO em :root e o
     claro em [data-theme="light"] (ver comentário lá), então sem esse
     atributo a página nasceria escura por padrão antes de qualquer JS
     rodar. Hardcoded aqui (não via JS) para não ter nenhum flash de tema
     errado. Ver também o script inline no fim do <body>, que reforça isto
     DEPOIS de js/theme.js rodar (initTheme() de lá aplicaria o tema salvo
     do app — inclusive escuro — já que login.html compartilha o mesmo
     localStorage/origem; a tela de login precisa ficar sempre clara,
     independente da preferência do resto do app). -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox45 — Log in</title>
<!-- Favicon: mark do Toolbox45 (img/icon-toolbox45.ico). -->
<link rel="icon" type="image/x-icon" href="img/icon-toolbox45.ico">
<link rel="shortcut icon" type="image/x-icon" href="img/icon-toolbox45.ico">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Reaproveita as mesmas variáveis de tema/cor de destaque e as classes
     .btn/.set-input/.set-label/.set-hint já usadas nos modais do app
     (css/components.css) — css/login.css só acrescenta o layout específico
     desta página (card centralizado, divisor "or", botão "Sign in with
     Google"). Não carrega css/layout.css (grade do app/sidebar) — esta
     página não usa nada daquilo. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

<div class="login-card">
  <!-- Logo oficial do app (mesmo arquivo do header, ver .hdr-logo em
       index.html/css/layout.css) — cor única (--teal), não depende mais de
       [data-theme]. -->
  <div class="login-brand">
    <img class="login-logo-img" src="img/logo-toolbox45.png?v=1" alt="Toolbox45">
    <span class="login-logo-txt">Toolbox45</span>
  </div>

  <div class="set-hint login-error" id="loginPageErrorMsg" style="color:var(--red); display:none;"></div>

  <!-- Pedido do usuário: "na tela de login criar a opção para registro" —
       3 "views" dentro do mesmo card, uma visível por vez (ver
       _lpShowView() em js/login.js): log in (padrão), register, e a
       mensagem de "pendente de aprovação" (depois de um cadastro bem-
       sucedido, ou de um clique em "Sign in with Google" com um e-mail
       novo/ainda pendente — ver ?google=pending, tratado por
       _lpHandleGoogleRedirectResult()). -->
  <div id="lpLoginView">
    <div class="set-group" style="margin-top:14px;">
      <span class="set-label">Username</span>
      <input class="set-input" type="text" id="lpUsernameInput" autocomplete="username">
    </div>
    <div class="set-group">
      <span class="set-label">Password</span>
      <input class="set-input" type="password" id="lpPasswordInput" autocomplete="current-password">
    </div>
    <button type="button" class="btn btn-primary login-submit-btn" id="lpSubmitBtn" onclick="submitLocalLogin()">Log in</button>
    <div class="login-toggle-mode">Don't have an account? <a href="javascript:void(0)" onclick="_lpShowView('register')">Register</a></div>
  </div>

  <!-- Auto-cadastro local — pedido do usuário: "todo novo usuário deverá
       vir desabilitado. Exibir mensagem no cadastro dizendo que a conta
       está pendente de aprovação pelo administrador. se o usuário tentar
       se cadastrar novamente com o mesmo email informar que o cadastro
       está pendente de aprovação." Usa e-mail como identificador (mesmo
       padrão das contas Google, ver server/index.js: POST
       /api/auth/register) — não é "Username" livre como no login local
       acima (contas locais criadas por um super_admin em Manage users
       continuam podendo ter qualquer username). -->
  <div id="lpRegisterView" style="display:none;">
    <div class="set-hint login-error" id="lpRegisterErrorMsg" style="color:var(--red); display:none; margin-top:14px;"></div>
    <div class="set-group" style="margin-top:14px;">
      <span class="set-label">E-mail</span>
      <input class="set-input" type="email" id="lpRegEmailInput" autocomplete="email">
    </div>
    <div class="set-group">
      <span class="set-label">Password</span>
      <input class="set-input" type="password" id="lpRegPasswordInput" autocomplete="new-password">
    </div>
    <button type="button" class="btn btn-primary login-submit-btn" id="lpRegisterSubmitBtn" onclick="submitRegister()">Create account</button>
    <div class="login-toggle-mode">Already have an account? <a href="javascript:void(0)" onclick="_lpShowView('login')">Log in</a></div>
  </div>

  <!-- Mensagem final de "pendente de aprovação" — mesma view serve tanto
       para um cadastro local recém-criado quanto para o retorno de um
       "Sign in with Google" com e-mail novo/ainda pendente. Sem formulário
       nenhum, só o aviso + um link de volta pro login + o e-mail de
       suporte (pedido do usuário: "se precisar o usuário poderá enviar
       email para suporte@seg45.com.br"). -->
  <div id="lpPendingView" style="display:none;">
    <div class="login-pending-box" id="lpPendingMsg" style="margin-top:14px;"></div>
    <div class="login-toggle-mode">Need help? Contact <a href="mailto:suporte@seg45.com.br">suporte@seg45.com.br</a></div>
    <div class="login-toggle-mode"><a href="javascript:void(0)" onclick="_lpShowView('login')">← Back to log in</a></div>
  </div>

  <div class="login-divider" id="lpGoogleDivider"><span>or</span></div>

  <!-- "Sign in with Google": só aparece quando o backend tem
       GOOGLE_CLIENT_ID/SECRET/REDIRECT_URI configurados (ver GET
       /api/auth/providers e GET /api/auth/google em server/index.js) —
       escondido por padrão aqui e revelado por js/login.js
       (_lpInitGoogleButton()) pra nunca mostrar um botão morto. Clicar
       nele é uma navegação de página inteira (não um fetch) — o fluxo
       OAuth termina com um redirect de volta pra esta mesma página
       (?google=success|error|pending, ver _lpHandleGoogleRedirectResult()).
       Serve tanto para login quanto para cadastro (pedido do usuário: "Ele
       poderá se registrar com a conta do Google") — o backend decide se é
       um e-mail novo (cria pendente) ou já existente (loga, se aprovado). -->
  <button type="button" class="btn login-google-btn" id="lpGoogleBtn" onclick="startGoogleLogin()" style="display:none;">
    <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.6-6.6C35.2 2.6 30 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.7 6C12.2 13.1 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8C43.9 38 46.5 31.8 46.5 24.5z"/><path fill="#FBBC05" d="M10.3 19.2c-.5 1.5-.8 3.1-.8 4.8s.3 3.3.8 4.8l-7.7 6C1 31 0 27.7 0 24s1-7 2.6-10l7.7 6.2z"/><path fill="#34A853" d="M24 48c6 0 11.2-2 14.9-5.4l-7.5-5.8c-2.1 1.4-4.7 2.2-7.4 2.2-6.4 0-11.8-3.6-13.7-8.7l-7.7 6C6.5 42.6 14.6 48 24 48z"/></svg>
    <span>Sign in with Google</span>
  </button>

  <!-- "Sign in with Microsoft" — mesmo padrão do Google acima: só aparece
       quando o backend tem MICROSOFT_CLIENT_ID/SECRET/REDIRECT_URI
       configurados (GET /api/auth/providers e GET /api/auth/microsoft em
       server/index.js), revelado por js/login.js (_lpInitProviderButtons()).
       Pedido do usuário: "insira a opção para fazer login e cadastro com
       conta da Microsoft" — mesmo botão serve pra login E cadastro (e-mail
       novo nasce pendente de aprovação, igual ao Google). Mark oficial de 4
       quadrados coloridos (Microsoft brand guidelines). -->
  <button type="button" class="btn login-google-btn" id="lpMicrosoftBtn" onclick="startMicrosoftLogin()" style="display:none;">
    <svg width="16" height="16" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
    <span>Sign in with Microsoft</span>
  </button>
</div>

<script src="js/theme.js"></script>
<!-- js/theme.js acima é carregado só pela cor de destaque (accent —
     applyAccentColor(), independente de tema, ver js/theme.js) — mas seu
     initTheme() aplica o tema ESCURO/claro salvo do resto do app (mesmo
     localStorage), o que reabriria modo escuro aqui. Esta linha reforça
     data-theme="light" DEPOIS que initTheme() já rodou (scripts executam
     em ordem), sem precisar tocar em js/theme.js (compartilhado com
     index.html, onde o modo escuro continua normal). -->
<script>
  document.documentElement.setAttribute('data-theme', 'light');
  // O preset de accent "white" (branco) só existe/faz sentido no tema
  // escuro (ver comentário do preset "white" em ACCENT_PRESETS,
  // js/theme.js) — se o usuário tinha ele salvo (porque o RESTO do app
  // está em modo escuro), forçar esta página pro claro deixaria o botão
  // "Log in" branco em cima do card branco (--teal aplicado inline por
  // applyAccentColor() tem prioridade sobre a variável de tema). Mesma
  // rede de segurança que toggleModalTheme()/initAccentColor() já usam ao
  // entrar no tema claro — _resetAccentIfWhite() está definida acima, em
  // js/theme.js.
  if (typeof _resetAccentIfWhite === 'function') _resetAccentIfWhite();
</script>
<script src="js/login.js"></script>
<!-- js/logo-settings.js: aplica o logo customizado (Settings -> System ->
     Logo, admin-only, index.html) nesta tela ANTES do login — só a parte
     de boot (_logoBoot/_logoApplyToDom) roda aqui; o modal de
     administração inteiro é ignorado (getElementById retorna null pros
     ids que só existem em index.html). Pedido do usuário: "o logo trocado
     será da página de login e da página principal". -->
<script src="js/logo-settings.js"></script>
</body>
</html>
